  <main class="auth-main">
    <div class="auth-box">
      
<h1>Welcome back</h1>
<p>Sign in to the website dashboard.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrfmiddlewaretoken" value="xN1kPd8tGrka2Ej2VSZVtGUBGR1OrFFhSFrAWiZwZqocoqO8B26hftkW5NgaX6EA">
  <input type="hidden" name="next" value="">
  
  <div class="field">
  <label for="id_username">Email or username</label>
  <input type="text" name="username" autocomplete="username" autofocus maxlength="150" class="input" id="id_username" required>
  
  
</div>

  <div class="field">
  <label for="id_password">Password</label>
  <input type="password" name="password" autocomplete="current-password" class="input" id="id_password" required>
  
  
</div>

  <div class="check-row"><input type="checkbox" name="remember" class="check" id="id_remember"><label for="id_remember">Keep me signed in on this device</label></div>
